  <style>
    :root {
      --ink: #102a43;
      --paper: #f8f4ec;
      --coral: #f15b45;
      --teal: #0b9f8b;
      --deep-teal: #007c78;
      --yellow: #f9ce4a;
      --line: #d8d1c4;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      color: var(--ink);
      font-family: "DM Sans", sans-serif;
    }

    .display-font { font-family: "Fraunces", serif; }

    .focus-ring:focus-visible {
      outline: 3px solid var(--yellow);
      outline-offset: 4px;
    }

    .dot-grid {
      background-image: radial-gradient(rgba(16, 42, 67, 0.15) 1px, transparent 1px);
      background-size: 18px 18px;
    }

    .hero-orbit {
      position: absolute;
      width: 450px;
      height: 450px;
      border: 1px solid rgba(255, 255, 255, 0.27);
      border-radius: 50%;
      top: -165px;
      right: -130px;
      pointer-events: none;
    }

    .hero-orbit::before {
      content: "";
      position: absolute;
      width: 17px;
      height: 17px;
      left: 45px;
      bottom: 48px;
      border-radius: 50%;
      background: var(--yellow);
      box-shadow: 0 0 0 8px rgba(249, 206, 74, 0.18);
    }

    .product-card {
      transition: transform 220ms ease, box-shadow 220ms ease;
    }

    .product-card:hover {
      transform: translateY(-7px);
      box-shadow: 0 20px 38px rgba(16, 42, 67, 0.14);
    }

    .product-image {
      transition: transform 500ms ease;
    }

    .product-card:hover .product-image {
      transform: scale(1.06);
    }

    .reveal {
      animation: rise 700ms both;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .catalog-value {
      border-top: 1px solid var(--line);
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .reveal,
      .product-card,
      .product-image { animation: none; transition: none; }
    }
  </style>

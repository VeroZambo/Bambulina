    <div class="w-12 h-12 rounded-lg bg-[#d7efed] text-[#007c78] flex items-center justify-center shrink-0"><i data-lucide="box" width="21" height="21"></i>
    </div>
    <div class="min-w-0 flex-1">
     <div class="flex justify-between gap-3">
      <h3 data-template-id="cart-item-title" class="canva-text font-bold text-sm"></h3><button type="button" class="remove-item focus-ring p-1 rounded text-[#a33a2f]" aria-label="Quitar producto"> <i data-lucide="trash-2" width="16" height="16"></i> </button>
     </div>
     <p data-template-id="cart-item-price" class="canva-text text-sm mt-1"></p>
     <div class="flex items-center justify-between mt-3">
      <div class="flex items-center border border-[#d8d1c4] rounded-full overflow-hidden"><button type="button" class="decrease-item quantity-button focus-ring" aria-label="Restar una unidad"><i data-lucide="minus" width="14" height="14"></i></button> <span class="item-quantity w-7 text-center text-sm font-bold"></span> <button type="button" class="increase-item quantity-button focus-ring" aria-label="Sumar una unidad"><i data-lucide="plus" width="14" height="14"></i></button>
      </div><strong class="item-line-total text-sm"></strong>
     </div>
    </div>
   </article>
  </template>
  <div id="live-message" class="sr-only" aria-live="polite"></div>
  <script>
    const products = {
      heart: { name: "Corazón anatómico", price: 18500 },
      dino: { name: "Esqueleto de dinosaurio", price: 16200 },
      solar: { name: "Sistema solar orbital", price: 22400 },
      geometry: { name: "Kit de geometría", price: 14300 },
      molecule: { name: "Modelo molecular", price: 19800 },
      map: { name: "Mapa topográfico", price: 17600 }
    };

    const cart = new Map();
    const currency = new Intl.NumberFormat("es-AR", { style: "currency", currency: "ARS", maximumFractionDigits: 0 });

    const cartDrawer = document.getElementById("cart-drawer");
    const cartBackdrop = document.getElementById("cart-backdrop");
    const cartItems = document.getElementById("cart-items");
    const cartEmpty = document.getElementById("cart-empty");
    const cartSummary = document.getElementById("cart-summary");
    const orderReview = document.getElementById("order-review");
    const liveMessage = document.getElementById("live-message");

    function setDrawer(open) {
      cartDrawer.classList.toggle("open", open);
      cartBackdrop.classList.toggle("open", open);
      cartDrawer.setAttribute("aria-hidden", String(!open));
      cartBackdrop.setAttribute("aria-hidden", String(!open));
      document.getElementById("open-cart").setAttribute("aria-expanded", String(open));
      if (!open) orderReview.classList.add("hidden");
    }

    function announce(message) {
      liveMessage.textContent = message;
    }

    function renderCart() {
      cartItems.innerHTML = "";
      const hasItems = cart.size > 0;
      cartEmpty.classList.toggle("hidden", hasItems);
      cartSummary.classList.toggle("hidden", !hasItems);

      let count = 0;
      let total = 0;

      cart.forEach((quantity, productId) => {
        const product = products[productId];
        const lineTotal = product.price * quantity;
        count += quantity;
        total += lineTotal;

        const fragment = document.getElementById("cart-item-template").content.cloneNode(true);
        const row = fragment.querySelector("[data-template-id='cart-item']");
        row.dataset.productId = productId;
        row.querySelector("[data-template-id='cart-item-title']").textContent = product.name;
        row.querySelector("[data-template-id='cart-item-price']").textContent = currency.format(product.price);
        row.querySelector(".item-quantity").textContent = quantity;
        row.querySelector(".item-line-total").textContent = currency.format(lineTotal);

        row.querySelector(".increase-item").addEventListener("click", () => changeQuantity(productId, 1));
        row.querySelector(".decrease-item").addEventListener("click", () => changeQuantity(productId, -1));
        row.querySelector(".remove-item").addEventListener("click", () => {
          cart.delete(productId);
          renderCart();
          announce(product.name + " fue eliminado del carrito.");
        });

        cartItems.appendChild(fragment);
      });

      document.getElementById("cart-count").textContent = count;
      document.getElementById("cart-total").textContent = currency.format(total);
      document.getElementById("cart-units").textContent = count + (count === 1 ? " producto en tu carrito" : " productos en tu carrito");
    }

    function changeQuantity(productId, amount) {
      const next = (cart.get(productId) || 0) + amount;
      if (next <= 0) cart.delete(productId);
      else cart.set(productId, next);
      renderCart();
    }

    function showOrderReview() {
      const reviewItems = document.getElementById("order-review-items");
      reviewItems.innerHTML = "";
      let total = 0;

      cart.forEach((quantity, productId) => {
        const product = products[productId];
        const lineTotal = product.price * quantity;
        total += lineTotal;
        const line = document.createElement("div");
        line.className = "flex items-center justify-between gap-4 text-sm border-b border-[#d8d1c4] pb-3";
        line.innerHTML = "<span><strong>" + quantity + "×</strong> " + product.name + "</span><strong>" + currency.format(lineTotal) + "</strong>";
        reviewItems.appendChild(line);
      });

      document.getElementById("review-total").textContent = currency.format(total);
      orderReview.classList.remove("hidden");
    }

    document.querySelectorAll(".add-product").forEach((button) => {
      button.addEventListener("click", () => {
        const id = button.dataset.productId;
        cart.set(id, (cart.get(id) || 0) + 1);
        renderCart();
        setDrawer(true);
        announce(products[id].name + " se agregó al carrito.");
      });
    });

    document.getElementById("open-cart").addEventListener("click", () => setDrawer(true));
    document.getElementById("close-cart").addEventListener("click", () => setDrawer(false));
    cartBackdrop.addEventListener("click", () => setDrawer(false));
    document.getElementById("explore-products").addEventListener("click", () => document.getElementById("catalogo").scrollIntoView({ behavior: "smooth" }));
    document.getElementById("clear-cart").addEventListener("click", () => {
      cart.clear();
      renderCart();
      announce("El carrito fue vaciado.");
    });
    document.getElementById("review-order").addEventListener("click", showOrderReview);
    document.getElementById("back-to-cart").addEventListener("click", () => orderReview.classList.add("hidden"));

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") setDrawer(false);
    });

    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      renderCart();
    });
  </script>
 </body>
</html>
